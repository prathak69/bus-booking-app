<router-outlet />

<!-- Native HTML5 Dialog -->
<dialog #authDialog class="auth-dialog shadow rounded-3 p-0 border-0" (click)="onBackdropClick($event)">
  <div class="modal-dialog m-0" role="document">
    <div class="modal-content border-0">
      <div class="modal-header d-flex justify-content-between align-items-center p-3 border-bottom">
        <h5 class="modal-title m-0">{{ isLoginForm() ? 'Sign In' : 'Register' }}</h5>
        <button type="button" class="btn-close" (click)="closeModel()" aria-label="Close"></button>
      </div>

      <div class="modal-body p-4">
        @if (isLoginForm()) {
          <form>
            <div class="mb-3">
              <label class="form-label" for="loginUser">User Name</label>
              <input type="text" id="loginUser" name="userName" [(ngModel)]="loginObj.userName" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="loginPass">Password</label>
              <input type="password" id="loginPass" name="password" [(ngModel)]="loginObj.password" class="form-control" required />
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" (click)="login()">Sign In</button>

            <div class="text-center">
              <p class="mb-0">Not a member? 
                <a role="button" class="text-primary text-decoration-underline" (click)="isLoginForm.set(false)">Register</a>
              </p>
            </div>
          </form>
        } @else {
          <form (ngSubmit)="registerUser()">
            <div class="mb-3">
              <label class="form-label" for="userName">User Name</label>
              <input type="text" id="userName" name="userName" [(ngModel)]="registerObj.userName" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="emailId">Email address</label>
              <input type="email" id="emailId" name="emailId" [(ngModel)]="registerObj.emailId" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" [(ngModel)]="registerObj.fullName" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input type="password" id="password" name="password" [(ngModel)]="registerObj.password" class="form-control" required />
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>

            <div class="text-center">
              <p class="mb-0">Already a member? 
                <a role="button" class="text-primary text-decoration-underline" (click)="isLoginForm.set(true)">Login</a>
              </p>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</dialog>
