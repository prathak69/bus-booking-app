<section id="booking-form" class="my-4">
    <div class="container mt-5">
        <div class="row">

            <div class="col-4">
                <div class="row">
                    <div class="col-12 text-center">
                        <h5> Bus Seats</h5>
                    </div>
                </div>
                <div class="row">
                    <div class="col-4 text-center">
                        <div class="seat reserved p-3 w-100">

                        </div>
                        Booked
                    </div>
                    <div class="col-4 text-center">
                        <div class="seat available p-3 w-100">

                        </div>
                        Available
                    </div>
                    <div class="col-4 text-center">
                        <div class="seat selected p-3 w-100">

                        </div>
                        Selection
                    </div>
                    <hr>
                    <div class="row">
                        @for (seatNo of seatArray(); track $index) {
                        @if(checkedBookedSeat(seatNo)){
                        <div class="col-3">
                            <div class="seat reserved"> {{seatNo}}</div>
                        </div>
                        } @else{
                        @if(checkSeatSelected(seatNo)){
                        <div class="col-3">
                            <div class="seat selected" (click)="selectSeat(seatNo)"> {{seatNo}}</div>
                        </div>
                        }
                        @else{
                            <div class="col-3">
                            <div class="seat available" (click)="selectSeat(seatNo)"> {{seatNo}}</div>
                        </div>
                        }
                        }
                        }
                    </div>
                </div>
            </div>

            <div class="col-8" [formGroup]="bookingForm">
                <div formArrayName="BusBookingPassengers">
                    @for(passenger of passengers.controls; track $index){
                        <div class="row mb-2" [formGroupName]="$index">
                            <div class="col-3">
                                <label>Passenger Name</label>
                                <input type="text" formControlName="passengerName" class="form-control">
                            </div>
                            <div class="col-3">
                                <label>Age</label>
                                <input type="number" formControlName="age" class="form-control">
                            </div>
                            <div class="col-3">
                                <label>Gender</label>
                                <select formControlName="gender" class="form-select"> 
                                    <option value="">Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                            <div class="col-3">
                                <label>seat number</label>
                                <input type="number" formControlName="seatNo" class="form-control" readonly>
                            </div>
                        </div>
                    }
                </div>
                @if(selectedSeatArray().length){
                    <button (click)="postBusBooking()" class="btn btn-primary mt-4">Book</button>
                }
            </div>
        </div>
    </div>
</section>
